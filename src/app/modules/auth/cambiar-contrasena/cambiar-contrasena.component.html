<div class="p-6 bg-gray-50 min-h-full flex justify-center items-start pt-12">

  <div class="bg-white rounded-xl shadow-sm border border-gray-100 p-8 w-full max-w-[550px] animate-fade-in-up">

    <!-- Encabezado de la Tarjeta -->
    <div class="flex items-center gap-4 mb-8">
      <div class="w-12 h-12 rounded-full bg-[#3b82f6] text-white flex items-center justify-center shrink-0">
        <!-- Ícono de Candado -->
        <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" />
        </svg>
      </div>
      <div>
        <h2 class="text-xl font-bold text-gray-800">Cambiar contraseña</h2>
        <p class="text-sm text-gray-500 mt-1">Usa una combinación de letras, números y caracteres especiales.</p>
      </div>
    </div>

    <!-- Formulario -->
    <div class="space-y-5">

      <!-- Contraseña Actual -->
      <div class="relative">
        <input [type]="mostrarActual ? 'text' : 'password'"
               [(ngModel)]="datos.passwordActual"
               placeholder="Contraseña actual"
               class="w-full p-3.5 border border-gray-300 rounded-lg text-sm text-gray-700 focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500">

        <button (click)="toggleMostrarActual()" class="absolute right-4 top-3.5 text-gray-400 hover:text-gray-600 transition-colors focus:outline-none">
          <!-- Ícono de Ojo -->
          <svg *ngIf="!mostrarActual" xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" /><path stroke-linecap="round" stroke-linejoin="round" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" /></svg>
          <svg *ngIf="mostrarActual" xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l3.59 3.59m0 0A9.953 9.953 0 0112 5c4.478 0 8.268 2.943 9.543 7a10.025 10.025 0 01-4.132 5.411m0 0L21 21" /></svg>
        </button>
      </div>

      <!-- Nueva Contraseña -->
      <div class="relative">
        <input [type]="mostrarNueva ? 'text' : 'password'"
               [(ngModel)]="datos.nuevaPassword"
               placeholder="Nueva contraseña"
               class="w-full p-3.5 border border-gray-300 rounded-lg text-sm text-gray-700 focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500">

        <button (click)="toggleMostrarNueva()" class="absolute right-4 top-3.5 text-gray-400 hover:text-gray-600 transition-colors focus:outline-none">
          <svg *ngIf="!mostrarNueva" xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" /><path stroke-linecap="round" stroke-linejoin="round" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" /></svg>
          <svg *ngIf="mostrarNueva" xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l3.59 3.59m0 0A9.953 9.953 0 0112 5c4.478 0 8.268 2.943 9.543 7a10.025 10.025 0 01-4.132 5.411m0 0L21 21" /></svg>
        </button>
      </div>

      <!-- Confirmar Contraseña (Sin ojito, como en tu diseño) -->
      <div>
        <input type="password"
               [(ngModel)]="datos.confirmarPassword"
               placeholder="Confirmar nueva contraseña"
               class="w-full p-3.5 border border-gray-300 rounded-lg text-sm text-gray-700 focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500">
      </div>

    </div>

    <!-- Botón Actualizar -->
    <button (click)="actualizarContrasena()" class="mt-8 px-6 py-2.5 bg-[#1d73d6] text-white rounded-lg font-medium text-sm hover:bg-blue-700 transition-colors shadow-sm flex items-center gap-2">
      <!-- Ícono de Escudo con Paloma -->
      <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
        <path stroke-linecap="round" stroke-linejoin="round" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z" />
      </svg>
      Actualizar contraseña
    </button>

  </div>
</div>
