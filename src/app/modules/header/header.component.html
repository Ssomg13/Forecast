<!-- ================= ENCABEZADO / HEADER ================= -->
<header class="bg-white border-b border-gray-200 px-6 py-4 flex justify-between items-center mb-6 -mx-6 -mt-6">

  <!-- Lado Izquierdo: Breadcrumbs y Título -->
  <div>
    <div class="text-sm text-gray-500 mb-1 flex items-center gap-2">
      <span>Inicio</span>
      <span>></span>
      <!-- Aquí cambiamos el texto fijo por la variable -->
      <span class="font-semibold text-gray-700">{{ pantallaActual }}</span>
    </div>
    <!-- Y aquí también lo reemplazamos -->
    <h1 class="text-2xl font-bold text-gray-800">{{ pantallaActual }}</h1>
  </div>

  <!-- Lado Derecho: Notificaciones y Perfil -->
  <div class="flex items-center gap-6">

    <!-- Campana de Notificaciones -->
    <div class="relative cursor-pointer mt-1">
      <!-- Ícono de campana genérico usando texto (puedes cambiarlo por un SVG) -->
      <span class="text-gray-500 text-2xl">🔔</span>
      <!-- Globo rojo con el número -->
      <span class="absolute -top-1 -right-2 bg-red-600 text-white text-[10px] font-bold px-1.5 py-0.5 rounded-full border border-white">
          3
        </span>
    </div>

    <!-- Información del Usuario y Menú Desplegable -->
    <div class="flex items-center gap-3 relative">

      <!-- Nombre y Rol (Dato dinámico) -->
      <div class="text-right hidden md:block">
        <div class="font-bold text-sm text-gray-800">{{ nombreUsuario }}</div>
        <div class="text-xs text-gray-500 capitalize">{{ rolUsuario }}</div>
      </div>

      <!-- Avatar (Botón que dispara toggleMenu) -->
      <button
        (click)="toggleMenu()"
        class="w-10 h-10 rounded-full bg-blue-600 text-white font-bold flex items-center justify-center hover:bg-blue-700 transition-colors shadow-sm focus:outline-none">
        {{ inicialUsuario }}
      </button>

      <!-- Menú Desplegable (Se muestra solo si menuAbierto es true) -->
      <div *ngIf="menuAbierto" class="absolute right-0 top-12 mt-2 w-56 bg-white rounded-xl shadow-lg border border-gray-100 z-50 py-2 overflow-hidden">

        <a routerLink="/pronosticos" (click)="toggleMenu()" class="block px-4 py-2.5 text-sm text-gray-700 hover:bg-blue-50 hover:text-blue-700 font-medium transition-colors cursor-pointer">
          Pronósticos
        </a>

        <a routerLink="/cambiar-contrasena" (click)="toggleMenu()" class="block px-4 py-2.5 text-sm text-gray-700 hover:bg-blue-50 hover:text-blue-700 font-medium transition-colors cursor-pointer">
          Cambiar contraseña
        </a>

        <div class="border-t border-gray-100 my-1"></div>

        <a routerLink="/autorizar-pronosticos" (click)="toggleMenu()" class="block px-4 py-2.5 text-sm text-gray-700 hover:bg-blue-50 hover:text-blue-700 font-medium transition-colors cursor-pointer">
          Autorizar pronósticos
        </a>

        <a routerLink="/usuarios" (click)="toggleMenu()" class="block px-4 py-2.5 text-sm text-gray-700 hover:bg-blue-50 hover:text-blue-700 font-medium transition-colors cursor-pointer">
          Usuarios
        </a>

        <a routerLink="/perfiles" (click)="toggleMenu()" class="block px-4 py-2.5 text-sm text-gray-700 hover:bg-blue-50 hover:text-blue-700 font-medium transition-colors cursor-pointer">
          Perfiles
        </a>

        <a routerLink="/plantillas-correo" (click)="toggleMenu()" class="block px-4 py-2.5 text-sm text-gray-700 hover:bg-blue-50 hover:text-blue-700 font-medium transition-colors cursor-pointer">
          Plantillas de correo
        </a>

        <a routerLink="/procesos-sap" (click)="toggleMenu()" class="block px-4 py-2.5 text-sm text-gray-700 hover:bg-blue-50 hover:text-blue-700 font-medium transition-colors cursor-pointer">
          Procesos SAP
        </a>

        <div class="border-t border-gray-100 my-1"></div>

        <a (click)="cerrarSesion()" class="block px-4 py-2.5 text-sm text-red-600 hover:bg-red-50 font-medium transition-colors cursor-pointer flex items-center gap-2">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1" />
          </svg>
          Cerrar sesión
        </a>
      </div>

    </div>
  </div>
</header>
